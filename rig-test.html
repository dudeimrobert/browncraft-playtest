<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browncraft — Imported Frog Knight Rig Test</title>
  <link rel="stylesheet" href="./character-lab.css?v=2.4.5" />
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main class="lab-shell">
    <header class="lab-header">
      <div class="brand-block"><img src="./assets/title-browncraft-shadow.png" alt="Browncraft"><div><strong>Frog Knight Rig Test</strong><span>Sir Croaksalot · Alpha 2.4.5 · Rigid segmented salvage</span></div></div>
      <div class="header-actions"><a href="./rig-test.html">Final rigid rig</a><a href="./character-lab.html">Character Lab</a><a href="./index.html">← Back to Browncraft</a></div>
    </header>
    <section class="lab-workspace" style="grid-template-columns:1fr">
      <div class="viewport-panel">
        <div id="labViewport" class="viewport"></div>
        <div class="viewport-toolbar top-left">
          <button data-view="front">Front</button><button data-view="three">3/4</button><button data-view="side">Side</button><button data-view="back">Back</button>
        </div>
        <div class="viewport-toolbar top-right">
          <label><input id="pauseToggle" type="checkbox"> Pause</label><label><input id="weightsToggle" type="checkbox"> Skin weights</label><label><input id="skeletonToggle" type="checkbox"> Skeleton</label>
          <label><input id="wireframeToggle" type="checkbox"> Wireframe</label>
          <label><input id="turntableToggle" type="checkbox"> Turntable</label>
        </div>
        <div class="viewport-stats" id="viewportStats">Loading imported model…</div>
        <div class="animation-deck">
          <div class="anim-row primary-row">
            <select id="animationSelect"><option value="tpose">T-pose / alignment</option><option value="rest">Rest / bind pose</option><option value="idle" selected>Idle</option><option value="walk">Walk</option><option value="run">Run</option><option value="combatIdle">Combat Idle</option><option value="block">Block</option><option value="light">Light Slash</option><option value="heavy">Heavy Slash</option><option value="cast">Brown Cast</option><option value="flask">Flask</option><option value="dodge">Dodge</option><option value="hit">Hit Reaction</option><option value="death">Death</option></select>
            <label>Pose <input id="poseRange" type="range" min="0" max="0.999" value="0" step="0.001"></label><label class="speed-label">Speed <input id="speedRange" type="range" min="0.1" max="2" value="1" step="0.05"><output id="speedOut">1.00×</output></label>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./rig-test.js?v=2.4.5"></script>
</body>
</html>
