<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Browncraft — Frog Knight Character Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./character-lab.css?v=2.4.8" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="lab-shell">
    <header class="lab-header">
      <div class="brand-block">
        <img src="./assets/title-browncraft-shadow.png" alt="Browncraft" />
        <div><strong>Frog Knight Character Lab</strong><span>Procedural Hero Development Tool · Alpha 2.4.8</span></div>
      </div>
      <div class="header-actions">
        <button id="snapshotBtn">Snapshot PNG</button>
        <a href="./rig-test.html">Imported Rig Test</a>
        <a href="./index.html">← Back to Browncraft</a>
      </div>
    </header>

    <section class="lab-workspace">
      <div class="viewport-panel">
        <div id="labViewport" class="viewport"></div>
        <div class="viewport-toolbar top-left">
          <button data-view="front">Front</button><button data-view="three">3/4</button><button data-view="side">Side</button><button data-view="back">Back</button>
        </div>
        <div class="viewport-toolbar top-right">
          <label><input id="skeletonToggle" type="checkbox"> Skeleton</label>
          <label><input id="wireframeToggle" type="checkbox"> Wireframe</label>
          <label><input id="organicToggle" type="checkbox"> Organic Only</label>
          <label><input id="weightsToggle" type="checkbox"> Skin Weights</label>
          <label><input id="turntableToggle" type="checkbox"> Turntable</label>
        </div>
        <div class="viewport-stats" id="viewportStats">Bones 0 · Meshes 0 · Triangles 0 · Draws 0</div>
        <div class="animation-deck">
          <div class="anim-row primary-row">
            <select id="animationSelect">
              <option value="idle">Idle</option>
              <option value="walk">Walk</option>
              <option value="run">Run</option>
              <option value="combatIdle">Combat Idle</option>
              <option value="block">Block</option>
              <option value="light">Light Slash</option>
              <option value="heavy">Heavy Slash</option>
              <option value="cast">Brown Cast</option>
              <option value="flask">Flask</option>
              <option value="dodge">Dodge</option>
              <option value="hit">Hit Reaction</option>
              <option value="death">Death</option>
            </select>
            <button id="playPauseBtn">Pause</button>
            <label class="compact"><input id="loopToggle" type="checkbox" checked> Loop</label>
            <label class="speed-label">Speed <input id="speedRange" type="range" min="0.1" max="2" value="1" step="0.05"><output id="speedOut">1.00×</output></label>
          </div>
          <div class="timeline-row">
            <span id="timeLabel">0.00s</span>
            <input id="timeline" type="range" min="0" max="1" step="0.001" value="0">
            <span id="durationLabel">∞</span>
          </div>
        </div>
      </div>

      <aside class="inspector">
        <div class="inspector-tabs">
          <button class="active" data-tab="anatomy">Anatomy</button>
          <button data-tab="armor">Armor</button>
          <button data-tab="materials">Materials</button>
          <button data-tab="presets">Presets</button>
        </div>
        <div id="inspectorBody" class="inspector-body"></div>
        <div class="inspector-footer">
          <button id="resetBtn">Reset Lab</button>
          <button id="applyGameBtn" class="gold">Apply to Game</button>
        </div>
      </aside>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>
  <script type="module" src="./character-lab.js?v=2.4.8"></script>
</body>
</html>
